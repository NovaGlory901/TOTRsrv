[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "B"]
# B904: errors are translated into other errors on purpose, the chain is not needed.
# B905: zip(strict=True) would change what happens with uneven input.
ignore = ["B904", "B905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Tests and tools put the project on sys.path before importing it, and use short throwaway lambdas and names.
"tests/**" = ["E402", "E731", "E741"]
"tools/**" = ["E402", "E731"]
# The probe is a template filled in with %r; its own code has braces, so str.format would not do.
"tests/test_paths.py" = ["UP031"]
